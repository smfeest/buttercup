name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ConnectionStrings__AppDb: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=buttercup_app
      WEB_PROJECT_PATH: src/Buttercup.Web
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.1xx
          dotnet-quality: ga
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{env.WEB_PROJECT_PATH}}/.nvmrc
          cache: npm
          cache-dependency-path: ${{env.WEB_PROJECT_PATH}}/package-lock.json
      - name: Set SHORT_COMMIT_SHA
        run: echo "SHORT_COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Restore Node.js dependencies
        run: npm ci --strict-allow-scripts
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Build .NET solution
        run: dotnet build --configuration Release /WarnAsError
      - name: Build assets
        run: npx --no gulp build
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Run .NET tests
        env:
          BUTTERCUP_TEST_DB_SERVER_CONNECTION_STRING: Host=localhost;Port=5432;Username=postgres;Password=postgres;
        run: dotnet test --no-build --configuration Release --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Report .NET test coverage
        if: ${{ hashFiles('**/coverage.cobertura.xml') }}
        run: |
          ./scripts/build-dotnet-coverage-report.sh -reporttypes:TextSummary
          cat coverage/Summary.txt
      - name: Run Jest tests
        run: npx --no -- jest --coverage
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Upload reports to Codecov
        if: (github.actor != 'dependabot[bot]')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          fail_ci_if_error: true
          files: "**/coverage.cobertura.xml,**/coverage/lcov.info"
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Install Playwright browsers
        run: npx --no playwright install --with-deps
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Run Playwright tests
        run: npx --no playwright test
        working-directory: ${{env.WEB_PROJECT_PATH}}
        env:
          CreateDatabaseOnStartup: true
      - name: Upload Playwright test results
        if: "!cancelled()"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-results
          path: ${{env.WEB_PROJECT_PATH}}/.playwright/results
          if-no-files-found: ignore
      - name: Check formatting
        run: npx --no -- prettier -c .
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Lint scripts
        run: npx --no eslint .
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Lint styles
        run: npx --no -- stylelint --max-warnings 0 styles/
        working-directory: ${{env.WEB_PROJECT_PATH}}
  semgrep:
    name: Semgrep analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Analyze
        run: semgrep ci --no-suppress-errors
