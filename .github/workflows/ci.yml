name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    env:
      ConnectionStrings__AppDb: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=buttercup_app
      WEB_PROJECT_PATH: src/Buttercup.Web
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx
          dotnet-quality: ga
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{env.WEB_PROJECT_PATH}}/.nvmrc
          cache: npm
          cache-dependency-path: ${{env.WEB_PROJECT_PATH}}/package-lock.json
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Set SHORT_COMMIT_SHA
        run: echo "SHORT_COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Restore Node.js dependencies
        run: npm ci --strict-allow-scripts
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Begin Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"smfeest_buttercup" /o:"smfeest" \
            /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml" \
            /d:sonar.exclusions="**/wwwroot/**" \
            /d:sonar.javascript.lcov.reportPaths="**/coverage/lcov.info" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.token="$SONAR_TOKEN"
      - name: Build .NET solution
        run: dotnet build --configuration Release
      - name: Build assets
        run: npx --no gulp build
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Run .NET tests
        env:
          BUTTERCUP_TEST_DB_SERVER_CONNECTION_STRING: Host=localhost;Port=5432;Username=postgres;Password=postgres;
        run: dotnet test --no-build --configuration Release --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Report .NET test coverage
        if: ${{ hashFiles('**/coverage.cobertura.xml') }}
        run: |
          ./scripts/build-dotnet-coverage-report.sh -reporttypes:TextSummary
          cat coverage/Summary.txt
      - name: Run Jest tests
        run: npx --no -- jest --coverage
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: End Sonar analysis
        if: "!cancelled()"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - name: Install Playwright browsers
        run: npx --no playwright install --with-deps
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Run Playwright tests
        run: npx --no playwright test
        working-directory: ${{env.WEB_PROJECT_PATH}}
        env:
          CreateDatabaseOnStartup: true
      - name: Upload Playwright test results
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: ${{env.WEB_PROJECT_PATH}}/.playwright/results
          if-no-files-found: ignore
      - name: Check formatting
        run: npx --no -- prettier -c .
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Lint scripts
        run: npx --no eslint .
        working-directory: ${{env.WEB_PROJECT_PATH}}
      - name: Lint styles
        run: npx --no -- stylelint --max-warnings 0 styles/
        working-directory: ${{env.WEB_PROJECT_PATH}}
